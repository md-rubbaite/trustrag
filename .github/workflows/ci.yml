name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q -rs

  postgres:
    # Same tests against PostgreSQL 17 + pgvector, with Row-Level Security as the second lock.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      TRUSTRAG_PG_OWNER_DSN: host=127.0.0.1 port=5432 dbname=trustrag user=trustrag_owner password=owner
      TRUSTRAG_PG_APP_DSN: host=127.0.0.1 port=5432 dbname=trustrag user=trustrag_app password=app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Create owner and least-privilege app roles
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE trustrag_owner LOGIN PASSWORD 'owner';
          CREATE ROLE trustrag_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE trustrag OWNER trustrag_owner;
          \c trustrag
          CREATE EXTENSION vector;
          SQL
      - run: pip install -e ".[dev]"
      - name: Tests (PostgreSQL tests must not be skipped)
        run: |
          set -o pipefail
          pytest -q -rs | tee out.txt
          if grep -q "SKIPPED" out.txt; then echo "PostgreSQL tests were skipped"; exit 1; fi
      - name: Leakage evaluation on PostgreSQL
        run: |
          PGPASSWORD=owner psql -h 127.0.0.1 -U trustrag_owner -d trustrag -v ON_ERROR_STOP=1 -c "TRUNCATE trustrag_chunks"
          trustrag eval --postgres "$TRUSTRAG_PG_APP_DSN" --json eval.json | tee eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"
