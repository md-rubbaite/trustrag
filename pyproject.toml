[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trustrag"
version = "0.1.0"
description = "Permission-aware retrieval-augmented generation: tenant isolation, document ACLs enforced inside retrieval, verified citations and sensitive-data filtering, with a leakage evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rubbaite T. Hassain" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.120", "uvicorn>=0.38"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=9.2.0", "ruff>=0.17.5", "fastapi>=0.120", "httpx>=0.28.1", "psycopg[binary]>=3.2"]

[project.scripts]
trustrag = "trustrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustrag = ["data/*.json", "sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette asks for a renamed httpx package in its test client; the stable httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
